name: Deploy Plugin Manager Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-release]
  workflow_run:
    workflows: ["Build Dec 18 Studios Plugins"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-plugin-manager-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: plugin-manager-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Generate plugin channel manifests from latest plugin releases
        env:
          # PLUGIN_REPOS_PAT must have 'repo' scope to read private plugin repos.
          # Add it as a repository secret in Dec18-Plugin-Manager settings.
          PLUGIN_PAT: ${{ secrets.PLUGIN_REPOS_PAT }}
        run: |
          mkdir -p tmp/releases tmp/configs

          # All plugin repos: REPO_NAME|PLUGIN_ID
          PLUGINS=(
            "Hue-Contrast-Compressor-DCTL|hue-contrast-compressor-dctl"
            "Perfect-Exposure-DCTL|perfect-exposure-dctl"
            "Volume-Curve-DCTL|volume-curve-dctl"
            "Grain-By-Greg-DCTL|grain-by-greg-dctl"
            "Film-Negative-Space-CST-DCTL|film-negative-space-cst-dctl"
            "Saturation-Separator-DCTL|saturation-separator-dctl"
            "Linear-Ramp-Diagnostic-DCTL|linear-ramp-diagnostic-dctl"
            "Color-Slice-Omatic-DCTL|color-slice-omatic-dctl"
            "Dolby-Vision-Spoofer-DCTL|dolby-vision-spoofer-dctl"
            "Hue-Contrast-Compressor-OFX|hue-contrast-compressor-ofx"
            "Technically-Technicolor-DRT|technicolor-drt-ofx"
            "PhotoChemist-OFX|photochemist"
            "OpenDRT-OFX|opendrt-ofx"
            "IBKeymaster|ibkeymaster-ofx"
            "X-Grade-OFX|x-grade-ofx"
            "Resolve-Node-Toggler|resolve-node-toggler"
            "SplitToneX-OFX|split-tone-x-ofx"
            "Trim-Top-Bottom-DCTL|trim-top-bottom-dctl"
            "GradeMatch-OFX|grade-match"
            "Hue-Inspector-DCTL|GE_hue_inspector_dctl"
            "Color-Slicer-DCTL|GE_Color_Slicer"
            "IDT-Lut-Loaders-DCTL|idt-lut-loaders-dctl"
            "LookDevTools-OFX|lookdevtools"
            "LookDevTools-OFX|lookdevtools-intermediate"
          )

          PROCESSED=0

          for entry in "${PLUGINS[@]}"; do
            IFS='|' read -r REPO PLUGIN_ID <<< "$entry"
            CONFIG_FILE="tmp/configs/${PLUGIN_ID}-config.json"
            RELEASES_FILE="tmp/releases/${PLUGIN_ID}-releases.json"

            # Fetch config from private repo; fall back to local copy in docs/plugins/ if present
            LOCAL_CONFIG="docs/plugins/${PLUGIN_ID}/manager-release-config.json"
            if curl -fsSL \
              -H "Authorization: token $PLUGIN_PAT" \
              "https://raw.githubusercontent.com/dec18studios/${REPO}/main/manager-release-config.json" \
              -o "$CONFIG_FILE" 2>/dev/null; then
              : # remote fetch succeeded
            elif [ -f "$LOCAL_CONFIG" ]; then
              echo "::notice::${REPO}: remote config unavailable, using local fallback"
              cp "$LOCAL_CONFIG" "$CONFIG_FILE"
            else
              echo "::notice::${REPO}: no config found — skipping"
              continue
            fi

            # Merge the local "demo" block (if any) onto the resolved config.
            # Demo-download definitions live in the Plugin-Manager repo
            # (docs/plugins/<id>/manager-release-config.json), so they apply even
            # when the remote plugin-repo config wins above and lacks a demo block.
            if [ -f "$LOCAL_CONFIG" ]; then
              node -e '
                const fs = require("fs");
                const [cfgPath, localPath] = process.argv.slice(1);
                const cfg = JSON.parse(fs.readFileSync(cfgPath, "utf8"));
                const local = JSON.parse(fs.readFileSync(localPath, "utf8"));
                if (local && local.demo) {
                  cfg.demo = local.demo;
                  fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2) + "\n");
                  console.log("::notice::Merged local demo block into config for "+cfgPath);
                }
              ' "$CONFIG_FILE" "$LOCAL_CONFIG" || echo "::warning::${REPO}: demo merge failed"
            fi

            # Fetch releases
            if ! curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PLUGIN_PAT" \
              "https://api.github.com/repos/dec18studios/${REPO}/releases?per_page=100" \
              -o "$RELEASES_FILE" 2>/dev/null; then
              echo "::notice::${REPO}: failed to fetch releases — skipping"
              continue
            fi

            # Check for at least one stable release with assets
            STABLE_COUNT=$(jq '[.[] | select(.draft == false and .prerelease == false and (.assets | length > 0))] | length' "$RELEASES_FILE" 2>/dev/null || echo 0)
            if [ "$STABLE_COUNT" -eq 0 ]; then
              echo "::notice::${REPO}: no stable releases with assets yet — skipping"
              continue
            fi

            echo "::notice::Generating manifests for ${PLUGIN_ID} from ${REPO} (${STABLE_COUNT} stable releases)"
            if node tools/generate-plugin-channel-manifests.mjs \
              --manager-root "$GITHUB_WORKSPACE" \
              --config "$GITHUB_WORKSPACE/$CONFIG_FILE" \
              --releases-json "$GITHUB_WORKSPACE/$RELEASES_FILE"; then
              PROCESSED=$((PROCESSED + 1))
            else
              echo "::error::${PLUGIN_ID}: manifest generation failed — skipping (check assetPattern in manager-release-config.json)"
            fi
          done

          echo "::notice::Processed ${PROCESSED}/${#PLUGINS[@]} plugin repos"

      - name: Rewrite download URLs through proxy
        env:
          PROXY_BASE: ${{ vars.DOWNLOAD_PROXY_URL || 'https://dec18-download-proxy.dec18studios.workers.dev' }}
        run: |
          # Rewrite the licensed "downloadUrl" in manifests to route through the proxy.
          # Free-tier plugins skip the proxy so users can download without a license token.
          # IMPORTANT: only the "downloadUrl" key is rewritten — the public
          # "demoDownloadUrl" must stay a direct github.com URL so unlicensed users
          # can download the watermarked demo without a token (the proxy would 401 them).
          for manifest in docs/plugins/*/stable.json docs/plugins/*/beta.json; do
            [ -f "$manifest" ] || continue
            # licenseTier lives in index.json (the authoritative catalog the app
            # reads), NOT in the per-plugin manifest (that field is null there).
            # Look it up by plugin id (= manifest's parent dir) so free plugins
            # are correctly skipped — a free download must stay a direct public
            # github.com URL, or logged-out users hit the proxy and get a 401.
            pid=$(basename "$(dirname "$manifest")")
            tier=$(node -e "try{const idx=JSON.parse(require('fs').readFileSync('docs/plugins/index.json','utf8'));const list=Array.isArray(idx)?idx:(idx.plugins||[]);const e=list.find(p=>(p.pluginId||p.id)===process.argv[1]);console.log((e&&e.licenseTier)||'')}catch{console.log('')}" "$pid")
            if [ "$tier" = "free" ]; then
              # Free downloads must be direct/public. UN-proxy (not just skip) so a
              # stale manifest that a prior buggy run proxied is corrected even when
              # the plugin wasn't regenerated this run (e.g. no new release).
              sed -i "s|${PROXY_BASE}/v1/|https://github.com/|g" "$manifest"
              echo "::notice::Free plugin kept direct (un-proxied): ${pid}/$(basename $manifest)"
              continue
            fi
            # Anchor on the "downloadUrl": key so "demoDownloadUrl" is left untouched.
            sed -i "s|\"downloadUrl\": \"https://github.com/\([^/]*/[^/]*/releases/download/[^\"]*\)|\"downloadUrl\": \"${PROXY_BASE}/v1/\1|g" "$manifest"
            echo "::notice::Rewrote licensed downloadUrl in $(basename $(dirname $manifest))/$(basename $manifest)"
          done

      - name: Commit generated manifests back to repo
        run: |
          git config user.name "catalog-bot"
          git config user.email "noreply@dec18studios.com"
          git add docs/plugins/*/stable.json docs/plugins/*/beta.json docs/plugins/index.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update plugin manifests [skip ci]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate catalog (no drift between index.json and website-tools.json)
        run: |
          # Fail the deploy if the website tool list references any plugin the app
          # doesn't actually ship (or vice-versa). index.json is the one source of
          # truth; website-tools.json may only style tools that exist in it.
          node tools/validate-catalog.mjs --manager-root "$GITHUB_WORKSPACE"

      - name: Prepare Pages content
        run: |
          rm -rf pages-dist
          cp -R docs pages-dist

      - name: Generate updater feed from latest manager release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          node tools/generate-updater-feed.mjs --output pages-dist/updates/latest.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "pages-dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
