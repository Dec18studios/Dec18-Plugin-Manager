name: License Key Fulfillment

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      order_id:
        description: 'Squarespace order ID (passed by webhook Worker)'
        required: false
        default: ''
      notification_id:
        description: 'Squarespace notification UUID'
        required: false
        default: ''
      trigger_source:
        description: 'What triggered this run'
        required: false
        default: 'manual'

permissions:
  contents: write

env:
  # ── Email ──
  FROM_EMAIL: "create@dec18studios.com"
  FROM_NAME: "Dec 18 Studios"

jobs:
  fulfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process new Happy Little Noder purchases
        env:
          SQUARESPACE_API_KEY: ${{ secrets.SQUARESPACE_API_KEY }}
          LICENSE_SIGNING_PRIVATE_KEY: ${{ secrets.LICENSE_SIGNING_PRIVATE_KEY }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
        run: node tools/fulfill-licenses.mjs

      - name: Commit processed subscribers
        id: commit
        run: |
          git config user.name "license-bot"
          git config user.email "noreply@dec18studios.com"
          git add tools/license-keys/processed-subscribers.json
          if git diff --cached --quiet; then
            echo "ledger_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update processed subscribers [skip ci]"
            echo "ledger_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git pull --rebase origin main
          git push

      # Keep the email-OTP auth Worker's D1 `accounts` table in sync with the
      # license-code fulfillment ledger. Without this, a freshly purchased email
      # gets its key mailed but is unknown to email sign-in ("no purchase found")
      # until someone re-runs the import by hand. Idempotent UPSERTs.
      # Scheduled runs only sync when the ledger actually changed (cheap no-op
      # otherwise); a manual `workflow_dispatch` always syncs, giving an
      # on-demand "force re-sync" escape hatch and a way to validate the token.
      - name: Sync subscribers into auth Worker D1
        if: steps.commit.outputs.ledger_changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd tools/auth-worker
          node import-subscribers.mjs > /tmp/seed.sql
          npx --yes wrangler@4 d1 execute dec18-auth --remote --file=/tmp/seed.sql
