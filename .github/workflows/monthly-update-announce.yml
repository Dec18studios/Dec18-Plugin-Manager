name: Monthly Update Announcement

# The monthly "here is what changed" email, in two variants: free-tool
# downloaders get the upgrade-flavoured version, licence holders get the
# member version.
#
# HOW A CAMPAIGN GOES OUT
# Set two repository variables and then forget about it:
#
#   gh variable set NEWSLETTER_CAMPAIGN --body monthly-2026-10
#   gh variable set NEWSLETTER_AUTOSEND --body true
#
# The schedule below then sends 75 at a time, three times a day, until the
# whole list is done, which is about five days for ~930 people. When the
# audience is finished the script sends nothing on every later run, so leaving
# autosend on costs nothing.
#
# NEWSLETTER_CAMPAIGN is the real go button, not AUTOSEND. The campaign id is
# both the suppression key and the arming switch: while it points at a
# finished campaign every cron run is a no-op, and bumping it to a new month
# is what starts the next send. So bump it only AFTER that month's copy is
# written and you have read a dry run, because the cron will not wait for you
# to look.
#
# MANUAL RUNS
#   mode=dry-run    = list masked recipients, budget and day count, send
#                     nothing, mark nothing                        (default)
#   mode=send       = real send, up to max_sends this run. Use it to kick the
#                     first batch off now instead of waiting for the cron
#   test_email=addr = send BOTH variants to addr (two emails), mark nothing
#
# State lives in the download-logger D1 (campaign_sends, keyed on email +
# campaign), so every run picks up exactly where the last one stopped and
# nobody is ever emailed twice for the same campaign. That is what makes an
# unattended schedule safe: a duplicate run is a no-op, not a second email.
#
# Batching: Brevo's free tier is 300/day shared with licence fulfillment, the
# hourly demo welcome and OTP sign-in mail, so the script holds 75/day back
# for those and spends at most 225 on the newsletter. The three cron times sit
# inside one UTC day on purpose, because the script's daily budget counter
# rolls over at UTC midnight.
#
# The private licence ledger is checked out below with LEDGER_DEPLOY_KEY, and
# it is NOT optional for either audience: the member audience is built from it,
# and a live free send refuses to run without it because that is what stops a
# member who also grabbed a free tool from getting the free version.

on:
  schedule:
    # 14:00, 18:00 and 22:00 UTC. Three runs x 75 = the 225/day budget.
    - cron: "0 14,18,22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = list only; send = real emails"
        type: choice
        options: [dry-run, send]
        default: dry-run
      audience:
        description: "Who to mail this run"
        type: choice
        options: [both, free, member]
        default: both
      test_email:
        description: "Send BOTH variants to this address (marks nothing); overrides mode"
        required: false
        default: ""
      max_sends:
        description: "Cap for this run"
        required: false
        default: "75"
      daily_budget:
        description: "Newsletter sends allowed per day. Do not go past 250, it buys no extra day and eats the reserve"
        required: false
        default: "225"
      campaign:
        description: "Override the NEWSLETTER_CAMPAIGN variable for this run only"
        required: false
        default: ""
      skip_master:
        description: "Leave the perpetual master keys out of the member audience"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monthly-update-announce
  cancel-in-progress: false

jobs:
  send:
    # A scheduled run only sends when autosend is armed. A manual dispatch
    # always runs, so a dry run works whatever the variables say.
    if: github.event_name == 'workflow_dispatch' || vars.NEWSLETTER_AUTOSEND == 'true'
    runs-on: ubuntu-latest
    env:
      CAMPAIGN: ${{ inputs.campaign || vars.NEWSLETTER_CAMPAIGN }}
    steps:
      # The script falls back to its own hardcoded default when CAMPAIGN is
      # empty, which would quietly mail an unattended campaign nobody chose.
      # Refuse instead.
      - name: Require a campaign id
        if: env.CAMPAIGN == ''
        run: |
          echo "::error::No campaign id. Set the NEWSLETTER_CAMPAIGN repository variable" \
            "(gh variable set NEWSLETTER_CAMPAIGN --body monthly-YYYY-MM) or pass the" \
            "campaign input. Refusing to guess which campaign to send."
          exit 1

      - uses: actions/checkout@v4

      - name: Check out licence ledger
        uses: actions/checkout@v4
        with:
          repository: Dec18studios/license-ledger
          ssh-key: ${{ secrets.LEDGER_DEPLOY_KEY }}
          path: ledger

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send monthly update
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DOWNLOAD_LOGGER_SECRET: ${{ secrets.DOWNLOAD_LOGGER_SECRET }}
          LICENSE_LEDGER_DIR: ${{ github.workspace }}/ledger
          # inputs.* are all empty on a scheduled run, hence every fallback.
          AUDIENCE: ${{ inputs.audience || 'both' }}
          TEST_EMAIL: ${{ inputs.test_email }}
          MAX_SENDS: ${{ inputs.max_sends || '75' }}
          DAILY_BUDGET: ${{ inputs.daily_budget || '225' }}
          SKIP_MASTER: ${{ inputs.skip_master && '1' || '' }}
          # CONFIRM_SEND is the only thing that arms a real send. A test_email
          # run deliberately leaves it empty: two samples, nothing marked.
          CONFIRM_SEND: ${{ (github.event_name == 'schedule' || (inputs.mode == 'send' && inputs.test_email == '')) && 'yes-send-for-real' || '' }}
        run: node tools/monthly-update-announce.mjs
